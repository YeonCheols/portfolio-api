# google-github-actions/example-workflows 의 cloudrun-docker.yml 구성.
# master 푸시만 *.run.app 으로 올린다. api.ycseng.com 은 도메인 매핑 전까지 Vercel이다.
name: Cloud Run 배포

on:
  push:
    branches:
      - master

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  PROJECT_ID: project-b66f1d93-0f67-4e58-948
  GAR_LOCATION: asia-northeast1
  REPOSITORY: portfolio-api
  SERVICE: portfolio-api
  REGION: asia-northeast1
  WORKLOAD_IDENTITY_PROVIDER: projects/219710330777/locations/global/workloadIdentityPools/github-actions/providers/github-actions
  SERVICE_ACCOUNT: github-deploy@project-b66f1d93-0f67-4e58-948.iam.gserviceaccount.com

jobs:
  deploy:
    name: Cloud Run 배포
    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: gcloud 설치
        uses: google-github-actions/setup-gcloud@v2

      - name: 이미지에 포함할 portfolio-config CLI 준비
        env:
          GCP_PROJECT_ID: ${{ env.PROJECT_ID }}
        run: |-
          umask 077
          gcloud secrets versions access latest \
            --secret=PORTFOLIO_CONFIG_READ_TOKEN --project="$GCP_PROJECT_ID" \
            --out-file="$RUNNER_TEMP/portfolio-config-read-token"
          GH_TOKEN="$(cat "$RUNNER_TEMP/portfolio-config-read-token")"
          export GH_TOKEN
          cliTag=$(sh scripts/install-config-cli.sh --latest)
          sh scripts/install-config-cli.sh "$RUNNER_TEMP/portfolio-config-bin" "$cliTag"
          "$RUNNER_TEMP/portfolio-config-bin/portfolio-config" validate --app portfolio-api --env production
          echo "portfolio-config CLI: $cliTag" >> "$GITHUB_STEP_SUMMARY"

      - name: Docker Auth
        uses: docker/login-action@v3
        with:
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Build and Push Container
        run: |-
          docker build --target runtime --build-context configcli="$RUNNER_TEMP/portfolio-config-bin" -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}" ./
          docker push "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
          secrets_update_strategy: overwrite
          secrets: |-
            GH_TOKEN=PORTFOLIO_CONFIG_READ_TOKEN:latest
          env_vars_update_strategy: overwrite
          env_vars: |-
            PORTFOLIO_CONFIG_ENVIRONMENT=production
            PORTFOLIO_CONFIG_REF=master
          flags: --min-instances=0 --memory=1Gi --cpu=2 --port=8080 --allow-unauthenticated --service-account=${{ env.SERVICE_ACCOUNT }} --startup-probe=httpGet.path=/health,httpGet.port=8080,timeoutSeconds=3,periodSeconds=5,failureThreshold=6

      - name: Show Output
        run: |-
          echo "url=${{ steps.deploy.outputs.url }}"
          health="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "${{ steps.deploy.outputs.url }}/health" || true)"
          db="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "${{ steps.deploy.outputs.url }}/health/db" || true)"
          echo "health=${health} db=${db}"
          test "$health" = "200" && test "$db" = "200"

      - name: 임시 인증파일 정리
        if: always()
        run: rm -f -- "$RUNNER_TEMP/portfolio-config-read-token"
