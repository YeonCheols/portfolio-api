name: CI

on:
  pull_request:
    branches:
      - master
      - dev

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: pnpm 설치
        uses: pnpm/action-setup@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: Prisma Client 생성
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint:check

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: 단위 테스트 + 커버리지
        shell: bash
        run: |
          pnpm test:cov --ci --coverageReporters=text --coverageReporters=lcov | tee coverage-report.txt
          {
            echo "## 테스트 커버리지"
            echo '```'
            grep -E "^(File |All files)" coverage-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 커버리지 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d portfolio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: pnpm 설치
        uses: pnpm/action-setup@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: Prisma Client 생성
        run: pnpm prisma:generate

      - name: 통합 테스트
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/portfolio_test
          DATABASE_DIRECT_URL: postgresql://test:test@127.0.0.1:5432/portfolio_test
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec jest --config ./test/jest-e2e.json --runInBand --forceExit --ci
